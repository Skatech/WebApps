<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>{TITLE}</title>
    <style>
        html {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Consolas;
            font-size: 1em;
            letter-spacing: -0.04em;
        }
        div.frame {
            margin: 0 auto;
            max-width: min(32em, 100vw);
            height: calc(100dvh - 0.55em);
        }
        div.container {
            display: flex;
            flex-direction: column;
            margin: 0.25em 0.25em;
            height: 100%;
        }
        h1 {
            margin: 0.5em 0;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 400;
        }
        hr {
            border-top: 1px solid #888;
            border-bottom: 0;
        }
        h4 {
            text-align: center;  
            margin: 0 0 0.5em 0;
        }
        div.groups-container {
            margin: 1em auto;
            width: fit-content;
        }
        label {
            vertical-align: top;
        }
        input[type=text] {
            font-size: 1em;
            padding: 0.1em 0.1em;
            margin: 0;
            width: calc(100% - 6em);
        }
        input[type=submit] {
            width: 5em;
            margin: 0.5em 0;
            padding: 0.1em 1em;
            font-size: 1em;
        }
        div.link-container {
            margin: 1em 0;
            flex-grow: 1;
            overflow-y: auto;
        }
        div.link-container a {
            display: block;
            margin-left: 0.5em;
            color: unset;
            text-decoration: none;
            word-break: break-all;
        }
        div.link-container a:nth-child(even) {
            background-color: light-dark(hsl(from Canvas h s calc(l - 4)), hsl(from Canvas h s calc(l + 4)));
        }
        div.link-container a:hover {
            color: Canvas;
            background-color: color-mix(CanvasText, transparent 25%);
            /* text-decoration: underline; */
            /* background-color: color-mix(Canvas, green 12%); */
        }
        div.link-container a.nonplayable {
            color: #990000;
        }
        div.link-container div {
            display: block;
            margin: 0.5em 0 0 0;
            border-bottom: 1px solid #0060df;
            color: #0060df;
            font-size: 0.75em;
            font-weight: bolder;
            text-transform: uppercase;
            letter-spacing: normal;
            cursor: pointer;
        }
        audio, video {
            margin: auto;
            max-height: 90%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="container">
            <h1>{TITLE}</h1>
            <form method="post" action="/" enctype="text/plain">
                <details>
                    <summary>Options</summary>
                    <div class="groups-container">
                        <input type="checkbox" name="shownonplayable" {SHOWNP}><label> Show non-playable</label>
                        <input type="checkbox" name="plancacheupdate" {PCACHE}><label> Plan cache update</label>
                        <hr>
                    </div>
                    <div class="groups-container">
                        {GROUPS}
                    </div>
                </details>
                <div>
                    <input type="text" name="filter" value="{FILTER}" placeholder="File name part or wildcard" required />
                    <input type="submit" value="Search" />
                </div>
            </form>
            <div class="link-container">
                <h4>{FOUND}</h4>
                {FILES}
            </div>
        </div>
    </div>
    <script type="text/javascript">
        const datakey = "MediaServer.Data.PlayerVolume"

        /** @param {PointerEvent} e*/ function showPlayer(e) {
            if (e.target instanceof HTMLAnchorElement && ["audio", "video"].includes(e.target.dataset.player)) {
                /** @type {HTMLVideoElement|HTMLAudioElement} */ let player = document.player
                player?.parentNode.removeChild(document.player)
                player = document.player = document.createElement(e.target.dataset.player)
                player.controls = true
                player.autoplay = true

                player.volume = Number(localStorage.getItem(datakey) ?? "0.5")
                player.addEventListener("volumechange", function(evt) {
                    localStorage.setItem(datakey, evt.target.volume)
                })

                const source = document.createElement("source")
                source.src = e.target.getAttribute("href")
                source.type = e.target.dataset.type
                player.appendChild(source);                
                
                e.target.after(player)
                e.preventDefault()

                player.scrollIntoView({ behavior: 'smooth' })
            }
        }

        /** @param {PointerEvent} e*/ function openFolder(e) {
            if (e.target instanceof HTMLDivElement) {
                const dirname = e.target.innerText.replace(/^[^\\]*\\?/, "")
                document.querySelector("input[type=text]").value = dirname ? dirname + "\\*" : "*"
                document.querySelector("input[type=submit]").click()
            }
        }

        for(const a of document.querySelectorAll("a"))
            a.onclick = showPlayer

        for(const e of document.querySelectorAll("div.link-container div"))
            e.onclick = openFolder

    </script>
</body>
</html>
