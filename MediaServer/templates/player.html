<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{TITLE}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Consolas;
            font-size: 1em;
            letter-spacing: -0.04em;
        }
        div.frame {
            margin: 0 auto;
            max-width: min(32em, 100vw);
            height: calc(100dvh - 0.55em);
        }
        div.container {
            display: flex;
            flex-direction: column;
            margin: 0.25em 0.25em;
            height: 100%;
            /* padding: 0 0.25em;
            border: 1px solid #888;
            border-radius: 0.35em; */
        }
        div.middle {
            display: flex;
            flex-direction: column;
            margin: auto 0;
        }
        h4 {
            margin: 0.5em 0;
            text-align: center;
            font-size: 1em;
            font-weight: 400;
        }
        audio, video {
            margin: 1em 0;
        }
        a:link, a:visited, a:hover, a:active {
            color: unset;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="container">
            <div class="middle">
                <h4>{TRACKNAME}</h4>
                <{PLAYER} controls autoplay>
                    <source src="{TRACKURL}" type="{MIMETYPE}">
                </{PLAYER}>
                <a href="/">Return</a>
            </div>
        </div>
    </div>
    <script>
        const datakey = "MediaServer.Data.PlayerVolume"
        /** @type {HTMLVideoElement|HTMLAudioElement} */
        const player = document.querySelector("audio, video")

        player.volume = Number(localStorage.getItem(datakey) ?? "0.5")

        player.addEventListener("volumechange", function(evt) {
            localStorage.setItem(datakey, evt.target.volume)
        })
    </script>
</body>
</html>
